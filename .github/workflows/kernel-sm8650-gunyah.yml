# SM8650 (骁龙 8 Gen 3 / 小米14 / Redmi K70) 专用构建入口
#
# 为什么单独开一个入口：
#   kernel-custom.yml 的 workflow_dispatch 已经用满 GitHub 的 25 个 inputs 上限，
#   再往里加 use_gunyah / gunyah_builtin_qcom_platform 会让整个文件校验失败：
#   "you may only define up to 25 inputs for a workflow_dispatch event"
#
# 与 kernel-custom.yml 的差异（其余选项完全一致）：
#   1. android_version / kernel_version 固定为 android14 / 6.1（Gunyah VMID 修复只在这条线验证过）
#   2. use_gunyah 固定为 true（本入口的存在意义），额外暴露 gunyah_builtin_qcom_platform
#   3. 没有「修订版本 revision」：build.yml 只在 android12 生成 boot.img 时用到它，6.1 用不到
#   4. 新增 download_manager：默认关闭 —— 上游 KernelSU 变体的 manager APK 产物经常缺失
#      （SukiSU-Ultra 的 build-manager 最近几次跑都没有 artifact），下载失败会让整个 run 变红。
#      关掉后内核照常编，需要 manager 时自己去上游 Release 下载匹配版本安装即可。
#   5. 去掉了「自定义 ZRAM 算法」「自定义外部模块」两项（按需精简；build.yml 侧仍支持，
#      其他入口如 kernel-custom 照旧可以传）。
#
# 补丁与前置条件见 patches/README.md。
name: 内核构建 - SM8650 (8 Gen 3) Gunyah 修复

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本 ====================
      sub_level:
        description: "子版本号 (6.1，如 118 / 138)"
        required: true
        type: string
        default: "138"
      os_patch_level:
        description: "安全补丁级别 (需与子版本对应，如 2025-01 / 2025-06)"
        required: true
        type: string
        default: "2025-06"

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - None
          - Official
          - SukiSU
          - BakaSU
        default: BakaSU
      kernelsu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Latest(最新)
          - Custom(自定义)
        default: Stable(标准)
      download_manager:
        description: "下载配套 KernelSU Manager APK（上游产物可能缺失，失败会让整个 run 变红；默认关）"
        required: false
        type: boolean
        default: false

      # ==================== 可选配置 ====================
      custom_ref:
        description: "自定义引用 (仅在 KSU 分支为 'Custom(自定义)' 时使用)"
        required: false
        type: string
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 虚拟化支持 ====================
      virtualization_support:
        description: "虚拟化支持 (5.10~6.6: 槽位补丁)"
        required: false
        type: choice
        options:
          - "off"
          - "on"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== Gunyah VMID 修复 ====================
      gunyah_builtin_qcom_platform:
        description: "同时启用 CONFIG_GUNYAH_QCOM_PLATFORM=y（不开启则 gunyah_qcom.c 不编译，补丁无效）"
        required: false
        type: boolean
        default: true

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_ddk:
        description: "启用 DDK 防格机 LSM"
        required: true
        type: boolean
        default: false
      use_ntsync:
        description: "启用 NTsync"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（IPSet + BBR）"
        required: false
        type: boolean
        default: false
      use_kpm:
        description: "启用 KPM 功能"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false

      # ==================== ZRAM 扩展选项 ====================
      zram_full_algo:
        description: "启用 ZRAM 完整算法支持（6.12 自动跳过 legacy LZ4K/LZ4KD/LZ4K_OPLUS）"
        required: false
        type: boolean
        default: false

      # ==================== KPM 扩展选项 ====================
      kpm_password:
        description: "自定义 KPM 超级密码（留空=使用默认密码；建议设置，默认密码等于没有密码）"
        required: false
        type: string
        default: ""

      # ==================== 自定义内核选项 ====================
      custom_kernel_options:
        description: "自定义内核选项（每行一条 Kconfig/defconfig 片段）"
        required: false
        type: string
        default: ""

jobs:
  build-sm8650-gunyah:
    name: "SM8650-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # 固定 android14 / 6.1
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}

      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}

      # Gunyah 8 Gen 3 VMID 修复（本入口的存在意义）
      use_gunyah: true
      gunyah_builtin_qcom_platform: ${{ inputs.gunyah_builtin_qcom_platform }}

      # 与 kernel-custom 一致的功能开关
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      virtualization_support: ${{ inputs.virtualization_support || 'off' }}
      zram_full_algo: ${{ inputs.zram_full_algo || false }}
      kpm_password: ${{ inputs.kpm_password || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  get-ksu-manager:
    # 默认不下载：上游 manager 产物缺失时该 job 会 exit 1，导致整个 run 变红。
    # 需要配套 APK 时把 download_manager 打开；kernelsu_variant=None 时本来也不需要。
    if: ${{ inputs.download_manager && inputs.kernelsu_variant != 'None' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
